name: GoldBot

on:
  schedule:
    # Every 15 minutes. The rate changes at 00:00 UTC; frequent runs also make
    # Telegram commands answer faster.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs overlap and fight over the state file.
concurrency:
  group: goldbot
  cancel-in-progress: false

jobs:
  check-price:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check gold price and answer commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOLD_THRESHOLD: ${{ vars.GOLD_THRESHOLD || '400000' }}
        run: python goldbot.py --once --state-minimal

      - name: Persist alert state
        run: |
          if [ -n "$(git status --porcelain -- goldbot_state.json)" ]; then
            git config user.name "goldbot"
            git config user.email "goldbot@users.noreply.github.com"
            git add goldbot_state.json
            git commit -m "goldbot: update state [skip ci]"
            git push
          else
            echo "No state change."
          fi
